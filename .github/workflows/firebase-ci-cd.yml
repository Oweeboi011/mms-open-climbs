name: Firebase CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: firebase-ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Quality gates, build, bundle budget, tests (coverage-enforced)
        run: npm run qa

  # Firestore/Storage security rules against the emulators.
  integration:
    name: Integration (security rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Emulator JARs (~200 MB) are otherwise downloaded on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-
      - run: npm ci
      - run: npm run test:integration

  # Playwright smoke through the real app on the emulators.
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Emulator JARs (~200 MB) are otherwise downloaded on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: firebase-emulators-
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: coverage/e2e/
          if-no-files-found: ignore

  # Optional pre-production soak: when the STAGING_PROJECT_ID repo variable is
  # set, every green push to develop deploys there first, and promotion to
  # main waits for it. Setup: docs/guides/DEPLOYMENT.md#staging.
  staging:
    name: Deploy to staging
    needs: [quality, integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_PROJECT_ID != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      project_id: ${{ vars.STAGING_PROJECT_ID }}
      ref: ${{ github.sha }}
    secrets: inherit

  # develop passed every gate → open (or reuse) a PR into main and merge it
  # immediately. We merge directly here (rather than GitHub's "auto-merge"
  # UI feature, which requires a paid plan on private repos) so the deploy
  # job below can run in this same workflow run — a merge performed with the
  # default GITHUB_TOKEN would not trigger a fresh push-triggered run on main.
  promote:
    name: Merge develop → main
    runs-on: ubuntu-latest
    needs: [quality, integration, e2e, staging]
    # Staging is optional: skipped (no STAGING_PROJECT_ID) counts as passed.
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      needs.quality.result == 'success' && needs.integration.result == 'success' &&
      needs.e2e.result == 'success' &&
      (needs.staging.result == 'success' || needs.staging.result == 'skipped')
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open or reuse PR, then merge
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git log origin/main..origin/develop --oneline)" ]; then
            echo "No new commits ahead of main — nothing to promote."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head develop --state open --json number -q '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head develop \
              --title "Promote develop to main" \
              --body "Automated promotion — quality checks passed on develop (run ${{ github.run_id }})."
            PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head develop --state open --json number -q '.[0].number')
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge
          echo "merged=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production
    needs: [quality, integration, e2e, promote]
    if: |
      always() &&
      needs.quality.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.e2e.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (needs.promote.result == 'success' && needs.promote.outputs.merged == 'true')
      )
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      project_id: mms-open-climbs
      ref: main
    secrets: inherit
