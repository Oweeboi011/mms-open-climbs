# Blocking security analysis (taint tracking, injection, XSS). Semgrep in
# code-quality.yml is the advisory complement. See docs/guides/CODE-QUALITY.md.
name: CodeQL

on:
  push:
    branches: [main, develop]
    paths: ["src/**", "functions/src/**", "scripts/**", ".github/workflows/codeql.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["src/**", "functions/src/**", "scripts/**", ".github/workflows/codeql.yml"]
  schedule:
    - cron: "44 20 * * 2"

jobs:
  analyze:
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
