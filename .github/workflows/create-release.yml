name: Create-Release

# Runs semantic-release straight from npm: GitHub blocked the
# codfish/semantic-release-action repository (ToS) in June 2026.
# Config: tools/release.config.cjs.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Installed outside the project so the app's dependencies stay untouched;
      # NODE_PATH lets the config's plugins resolve from there.
      - name: Install semantic-release
        run: >
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/release"
          semantic-release@24 conventional-changelog-conventionalcommits@8

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_PATH: ${{ runner.temp }}/release/node_modules
        run: >
          "$RUNNER_TEMP/release/node_modules/.bin/semantic-release"
          --extends ./tools/release.config.cjs
