name: Supply chain & patterns

# Checks that depend on the state of the world rather than the diff. The
# diff-level gates (lint, arch, dupes, dead code, secrets, tests) all run in
# `npm run qa` inside firebase-ci-cd.yml, which guards the deploy.
# Why the split: docs/adr/0003-minimum-viable-quality-harness.md.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 2 * * 1" # weekly: new advisories land without a diff
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit app dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Audit Cloud Functions dependencies
        run: npm --prefix functions audit --audit-level=high --omit=dev

  patterns:
    name: Semgrep (advisory)
    runs-on: ubuntu-latest
    # Advisory: reported in the job summary, never blocks. CodeQL is the
    # blocking security analysis; secretlint in `qa` is the blocking secret scan.
    continue-on-error: true
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan with Semgrep rulesets
        run: |
          semgrep scan \
            --config p/javascript --config p/react --config p/secrets \
            --exclude dist --exclude coverage --exclude node_modules \
            --text >> "$GITHUB_STEP_SUMMARY" || true
