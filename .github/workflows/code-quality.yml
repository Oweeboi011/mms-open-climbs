name: Supply chain & patterns

# Checks that depend on the state of the world rather than the diff. The
# diff-level gates (lint, arch, dupes, dead code, secrets, tests) all run in
# `npm run qa` inside firebase-ci-cd.yml, which guards the deploy.
# Why the split: docs/adr/0003-minimum-viable-quality-harness.md.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 2 * * 1" # weekly: new advisories land without a diff
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    name: Dependency audit (moderate+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit app dependencies
        run: npm audit --audit-level=moderate --omit=dev
      - name: Audit Cloud Functions dependencies
        run: npm --prefix functions audit --audit-level=moderate --omit=dev

  patterns:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # Pinned so the rules engine changes only through a reviewed bump.
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@v7
      # Every finding goes to the Security tab beside CodeQL; ERROR-severity
      # findings fail the job. A false positive gets a `nosemgrep` comment
      # saying why — never a blanket exclude.
      - name: Scan
        run: |
          semgrep scan \
            --config p/javascript --config p/react --config p/secrets \
            --exclude dist --exclude coverage --exclude node_modules --exclude public \
            --sarif --output semgrep.sarif || true
          semgrep scan \
            --config p/javascript --config p/react --config p/secrets \
            --exclude dist --exclude coverage --exclude node_modules --exclude public \
            --severity ERROR --error --text
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
